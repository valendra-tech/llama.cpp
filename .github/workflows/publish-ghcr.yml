name: Publish GHCR server images

on:
  workflow_dispatch:
    inputs:
      cuda12_version:
        description: CUDA version for the cuda12 leg (nvidia/cuda tag component)
        required: false
        type: string
        default: "12.8.1"
      cuda13_version:
        description: CUDA version for the cuda13 leg (nvidia/cuda tag component)
        required: false
        type: string
        default: "13.3.0"
      cuda_docker_arch:
        description: Override CUDA architectures for both legs (empty = per-leg defaults)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build server ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda12
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: ${{ inputs.cuda12_version }}
            cuda_archs: 50-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real
            publish_latest: false
          - variant: cuda13
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: ${{ inputs.cuda13_version }}
            cuda_archs: 75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real
            publish_latest: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          REPO_OWNER="${GITHUB_REPOSITORY_OWNER@L}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_REPO="ghcr.io/${REPO_OWNER}/${REPO_NAME}"
          BUILD="b$(git rev-list --count HEAD)"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          VARIANT="${{ matrix.variant }}"

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "build=${BUILD}"
            echo "revision=${SHORT_HASH}"
            echo "tags=${IMAGE_REPO}:server-${VARIANT}-${BUILD},${IMAGE_REPO}:server-${VARIANT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Free disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            APP_VERSION=${{ steps.meta.outputs.build }}
            APP_REVISION=${{ steps.meta.outputs.revision }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            CUDA_VERSION=${{ matrix.cuda_version }}
            CUDA_DOCKER_ARCH=${{ inputs.cuda_docker_arch || matrix.cuda_archs }}
          annotations: |
            manifest:org.opencontainers.image.created=${{ steps.build_date.outputs.date }}
            manifest:org.opencontainers.image.version=${{ steps.meta.outputs.build }}
            manifest:org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            manifest:org.opencontainers.image.title=llama.cpp
            manifest:org.opencontainers.image.description=PrismML fork of llama.cpp with Bonsai low-bit support
            manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_repo }}:buildcache-server-${{ matrix.variant }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image_repo }}:buildcache-server-${{ matrix.variant }},mode=max

      - name: Alias latest to cuda13
        if: ${{ matrix.publish_latest }}
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:latest" \
            "${IMAGE_REPO}:server-${VARIANT}"
